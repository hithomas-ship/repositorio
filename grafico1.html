<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico 1: Mapa de Conexión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
    </style>
</head>
<body class="font-sans antialiased p-4">
    <div class="max-w-3xl mx-auto card-dark p-6 rounded-2xl shadow-xl">
        <div class="mb-4">
            <span class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">Paso 1</span>
            <h3 class="text-lg font-bold text-white mt-1">¿Dónde llega el Metro? Comunas y Trazados</h3>
            <p class="text-xs text-slate-400 mt-1">Selecciona una línea para visualizar las comunas y haz clic para ver su contexto.</p>
        </div>
        <div class="flex gap-3 mb-6">
            <button onclick="filterLine('L3')" id="btn-l3" class="px-4 py-2 bg-red-600 text-white font-semibold text-xs rounded-lg transition-all shadow-md">Línea 3 (Operativa)</button>
            <button onclick="filterLine('L10')" id="btn-l10" class="px-4 py-2 bg-slate-800 text-slate-300 font-semibold text-xs rounded-lg transition-all border border-slate-700">Línea 10 (Proyectada)</button>
        </div>
        <div id="comunasContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 mb-6"></div>
        <div id="comunaDetail" class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-sm"></div>
    </div>

    <script>
        const datosComunas = {
            L3: [
                { nombre: 'Quilicura', pop: '210.000 hab', pobreza: '6.5%', estado: 'Nueva Conexión (L3)', desc: 'Recibió su primera conexión directa de alta capacidad al sistema.' },
                { nombre: 'Conchalí', pop: '130.000 hab', pobreza: '9.2%', estado: 'Nueva Conexión (L3)', desc: 'Integra sectores históricamente postergados del norte de Santiago.' },
                { nombre: 'Santiago', pop: '500.000 hab', pobreza: '8.1%', estado: 'Conexión Central', desc: 'Eje neurálgico con múltiples combinaciones y alta población flotante.' },
                { nombre: 'Ñuñoa', pop: '250.000 hab', pobreza: '3.4%', estado: 'Alta Consolidación', desc: 'Zona residencial de ingresos medios-altos con alta densidad de estaciones.' },
                { nombre: 'La Reina', pop: '100.000 hab', pobreza: '2.8%', estado: 'Terminal Oriente', desc: 'Conecta el extremo oriente con la red estructurante.' }
            ],
            L10: [
                { nombre: 'Maipú', pop: '520.000 hab', pobreza: '7.3%', estado: 'Extensión Poniente', desc: 'Una de las comunas más populosas; la extensión por Vespucio optimizará su conectividad.' },
                { nombre: 'Cerrillos', pop: '80.000 hab', pobreza: '8.5%', estado: 'Zona en Desarrollo', desc: 'Alta expansión inmobiliaria y nuevos polos habitacionales.' },
                { nombre: 'Lo Espejo', pop: '98.000 hab', pobreza: '12.4%', estado: 'Nueva Conexión', desc: 'Comuna con desafíos de integración y alta necesidad de transporte estructurante.' },
                { nombre: 'La Cisterna', pop: '100.000 hab', pobreza: '9.1%', estado: 'Intermodal Clave', desc: 'Punto estratégico de combinación intermodal sur.' },
                { nombre: 'San Ramón', pop: '82.000 hab', pobreza: '13.8%', estado: 'Alta Vulnerabilidad', desc: 'Presenta uno de los índices más altos de pobreza por ingresos del trazado.' },
                { nombre: 'La Granja', pop: '116.000 hab', pobreza: '11.5%', estado: 'Conexión Sur', desc: 'Eje histórico de Vespucio Sur que requiere mejor conectividad transversal.' },
                { nombre: 'La Florida', pop: '402.000 hab', pobreza: '6.2%', estado: 'Consolidado', desc: 'Alta densidad demográfica y articulador del sector suroriente.' }
            ]
        };

        function filterLine(linea) {
            document.getElementById('btn-l3').className = linea === 'L3' ? "px-4 py-2 bg-red-600 text-white font-semibold text-xs rounded-lg shadow-md" : "px-4 py-2 bg-slate-800 text-slate-300 font-semibold text-xs rounded-lg border border-slate-700";
            document.getElementById('btn-l10').className = linea === 'L10' ? "px-4 py-2 bg-red-600 text-white font-semibold text-xs rounded-lg shadow-md" : "px-4 py-2 bg-slate-800 text-slate-300 font-semibold text-xs rounded-lg border border-slate-700";
            renderComunas(linea);
        }

        function renderComunas(linea) {
            const container = document.getElementById('comunasContainer');
            container.innerHTML = '';
            datosComunas[linea].forEach((c, idx) => {
                container.innerHTML += `
                    <div onclick="showDetail('${linea}', ${idx})" class="bg-slate-900 border border-slate-800 hover:border-red-500 p-3 rounded-xl cursor-pointer transition-all text-center">
                        <span class="text-[10px] font-bold text-red-400">${linea}</span>
                        <h4 class="text-xs font-semibold text-white mt-1">${c.nombre}</h4>
                        <span class="text-[10px] text-slate-400 block mt-0.5">${c.pop}</span>
                    </div>
                `;
            });
            showDetail(linea, 0);
        }

        function showDetail(linea, idx) {
            const c = datosComunas[linea][idx];
            document.getElementById('comunaDetail').innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <h4 class="text-sm font-bold text-white">${c.nombre} <span class="text-[11px] font-normal text-cyan-400 ml-1">(${c.estado})</span></h4>
                    <span class="text-[10px] bg-red-950 text-red-300 px-2 py-0.5 rounded border border-red-800">Pobreza: ${c.pobreza}</span>
                </div>
                <p class="text-slate-300 text-xs leading-relaxed">${c.desc}</p>
                <div class="mt-2 text-[10px] text-slate-500">Población total estimada (Censo / INE): <strong>${c.pop}</strong></div>
            `;
        }
        filterLine('L3');
    </script>
</body>
</html>

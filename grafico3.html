<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico 3: Análisis Cruzado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
    </style>
</head>
<body class="font-sans antialiased p-4">
    <div class="max-w-3xl mx-auto card-dark p-6 rounded-2xl shadow-xl">
        <div class="mb-3">
            <span class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">Paso 3</span>
            <h3 class="text-lg font-bold text-white mt-1">¿Dónde está la mayor necesidad?</h3>
            <p class="text-xs text-slate-400 mt-1">Relación: Población (Eje X) vs. Pobreza por Ingresos (Eje Y) por comuna.</p>
        </div>
        <div class="relative h-72 w-full">
            <canvas id="canvasScatter"></canvas>
        </div>
    </div>

    <script>
        const ctxScatter = document.getElementById('canvasScatter').getContext('2d');
        new Chart(ctxScatter, {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Comunas',
                    data: [
                        {x: 520, y: 7.3, label: 'Maipú'}, {x: 402, y: 6.2, label: 'La Florida'},
                        {x: 250, y: 3.4, label: 'Ñuñoa'}, {x: 210, y: 6.5, label: 'Quilicura'},
                        {x: 130, y: 9.2, label: 'Conchalí'}, {x: 116, y: 11.5, label: 'La Granja'},
                        {x: 100, y: 9.1, label: 'La Cisterna'}, {x: 98, y: 12.4, label: 'Lo Espejo'},
                        {x: 82, y: 13.8, label: 'San Ramón'}, {x: 80, y: 8.5, label: 'Cerrillos'}
                    ],
                    backgroundColor: '#ef4444',
                    pointRadius: 8,
                    pointHoverRadius: 11
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let p = context.raw;
                                return `${p.label}: ${p.x}k hab. | Pobreza: ${p.y}%`;
                            }
                        }
                    }
                },
                scales: {
                    x: { title: { display: true, text: 'Población Comunal (miles)', color: '#9ca3af', font: { size: 10 } }, grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } },
                    y: { title: { display: true, text: 'Pobreza por Ingresos (%)', color: '#9ca3af', font: { size: 10 } }, grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } }
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico 1: Estación por Estación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
        .station-line { background: linear-gradient(90deg, #ef4444 0%, #3b82f6 100%); }
    </style>
</head>
<body class="font-sans antialiased p-4">
    <div class="max-w-3xl mx-auto card-dark p-6 rounded-2xl shadow-xl">
        
        <!-- Subtítulo y bajada breve -->
        <div class="mb-5 border-b border-slate-800 pb-3">
            <span class="text-[10px] font-bold uppercase tracking-widest text-red-400 bg-red-950/60 px-2 py-0.5 rounded">Infraestructura y Territorio</span>
            <h3 class="text-base font-bold text-white mt-1">El pulso de la expansión: recorrido comuna por comuna</h3>
            <p class="text-xs text-slate-400 mt-0.5">Haz clic en cada estación para descubrir la realidad demográfica y social que conecta el trazado.</p>
        </div>

        <!-- Selector de Línea -->
        <div class="flex gap-2 mb-6">
            <button onclick="switchLine('L3')" id="btn-l3" class="px-3 py-1.5 bg-red-600 text-white font-semibold text-xs rounded-lg transition-all shadow-md">Línea 3 (Operativa)</button>
            <button onclick="switchLine('L10')" id="btn-l10" class="px-3 py-1.5 bg-slate-800 text-slate-300 font-semibold text-xs rounded-lg transition-all border border-slate-700">Línea 10 (Proyectada)</button>
        </div>

        <!-- Contenedor Visual estilo Plano de Metro -->
        <div class="relative py-4 mb-6">
            <!-- Línea de conexión de fondo -->
            <div class="absolute top-1/2 left-4 right-4 h-1 station-line -translate-y-1/2 rounded-full hidden sm:block"></div>
            <!-- Estaciones interactivas -->
            <div id="metroStations" class="relative z-10 flex flex-wrap sm:flex-nowrap justify-between gap-3 sm:gap-0">
                <!-- Se inyecta con JavaScript -->
            </div>
        </div>

        <!-- Panel de Detalle de la Estación Seleccionada -->
        <div id="stationDetail" class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl text-sm transition-all">
            <!-- Se inyecta con JavaScript -->
        </div>

    </div>

    <script>
        const metroData = {
            L3: [
                { nombre: 'Quilicura', tipo: 'Nueva Conexión', pop: '210.000 hab.', pobreza: '6.5%', desc: 'Primera conexión directa de alta capacidad para una comuna históricamente periférica.' },
                { nombre: 'Conchalí', tipo: 'Nueva Conexión', pop: '130.000 hab.', pobreza: '9.2%', desc: 'Integra de manera directa al sistema metropolitano sectores del norte de Santiago.' },
                { nombre: 'Santiago', tipo: 'Conexión Central', pop: '500.000 hab.', pobreza: '8.1%', desc: 'Eje neurálgico con múltiples combinaciones y alta afluencia diaria.' },
                { nombre: 'Ñuñoa', tipo: 'Consolidado', pop: '250.000 hab.', pobreza: '3.4%', desc: 'Zona residencial de alta densidad de estaciones y menor vulnerabilidad.' },
                { nombre: 'La Reina', tipo: 'Terminal', pop: '100.000 hab.', pobreza: '2.8%', desc: 'Articula el extremo oriente con la red estructurante central.' }
            ],
            L10: [
                { nombre: 'Maipú', tipo: 'Extensión Poniente', pop: '520.000 hab.', pobreza: '7.3%', desc: 'Comuna altamente poblada; la extensión por Vespucio optimizará su conectividad sur.' },
                { nombre: 'Cerrillos', tipo: 'Zona en Desarrollo', pop: '80.000 hab.', pobreza: '8.5%', desc: 'Foco de expansión inmobiliaria reciente con alta demanda de transporte.' },
                { nombre: 'Lo Espejo', tipo: 'Nueva Conexión', pop: '98.000 hab.', pobreza: '12.4%', desc: 'Desafíos importantes de integración urbana y alta necesidad de transporte masivo.' },
                { nombre: 'La Cisterna', tipo: 'Intermodal', pop: '100.000 hab.', pobreza: '9.1%', desc: 'Punto estratégico de combinación y articulación del transporte en el sector sur.' },
                { nombre: 'San Ramón', tipo: 'Alta Vulnerabilidad', pop: '82.000 hab.', pobreza: '13.8%', desc: 'Presenta uno de los índices de pobreza por ingresos más altos de todo el trazado.' },
                { nombre: 'La Granja', tipo: 'Conexión Sur', pop: '116.000 hab.', pobreza: '11.5%', desc: 'Eje de Vespucio Sur que requiere superar la desconexión transversal histórica.' },
                { nombre: 'La Florida', tipo: 'Consolidado', pop: '402.000 hab.', pobreza: '6.2%', desc: 'Alta densidad demográfica y nodo articulador del sector suroriente.' }
            ]
        };

        let currentLine = 'L3';
        let activeIndex = 0;

        function switchLine(linea) {
            currentLine = linea;
            activeIndex = 0;
            document.getElementById('btn-l3').className = linea === 'L3' ? "px-3 py-1.5 bg-red-600 text-white font-semibold text-xs rounded-lg shadow-md" : "px-3 py-1.5 bg-slate-800 text-slate-300 font-semibold text-xs rounded-lg border border-slate-700";
            document.getElementById('btn-l10').className = linea === 'L10' ? "px-3 py-1.5 bg-red-600 text-white font-semibold text-xs rounded-lg shadow-md" : "px-3 py-1.5 bg-slate-800 text-slate-300 font-semibold text-xs rounded-lg border border-slate-700";
            renderStations();
        }

        function renderStations() {
            const container = document.getElementById('metroStations');
            container.innerHTML = '';
            metroData[currentLine].forEach((station, idx) => {
                const isActive = idx === activeIndex;
                container.innerHTML += `
                    <div onclick="selectStation(${idx})" class="flex flex-col items-center cursor-pointer group flex-1">
                        <div class="w-6 h-6 rounded-full flex items-center justify-center transition-all ${isActive ? 'bg-red-500 ring-4 ring-red-500/30 scale-110' : 'bg-slate-800 group-hover:bg-slate-700 border border-slate-600'}">
                            <div class="w-2 h-2 rounded-full bg-white"></div>
                        </div>
                        <span class="text-[11px] font-semibold mt-2 text-center transition-colors ${isActive ? 'text-red-400' : 'text-slate-300 group-hover:text-white'}">${station.nombre}</span>
                    </div>
                `;
            });
            updateDetail();
        }

        function selectStation(idx) {
            activeIndex = idx;
            renderStations();
        }

        function updateDetail() {
            const s = metroData[currentLine][activeIndex];
            document.getElementById('stationDetail').innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-2 gap-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-500"></span>
                        <h4 class="text-sm font-bold text-white">${s.nombre}</h4>
                        <span class="text-[10px] bg-slate-800 text-cyan-400 px-2 py-0.5 rounded">${s.tipo}</span>
                    </div>
                    <div class="flex gap-2 text-xs">
                        <span class="text-slate-400">Población: <strong class="text-slate-200">${s.pop}</strong></span>
                        <span class="text-slate-400">Pobreza: <strong class="text-red-400">${s.pobreza}</strong></span>
                    </div>
                </div>
                <p class="text-slate-300 text-xs leading-relaxed">${s.desc}</p>
            `;
        }

        renderStations();
    </script>
</body>
</html>
